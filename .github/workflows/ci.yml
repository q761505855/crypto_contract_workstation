name: CI

# Automatic CI is temporarily paused. Tests remain available by explicit opt-in.
on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the full verification and browser test suite
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ inputs.run_tests }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, unit test, and build
        run: npm run check

  browser:
    name: Browser (${{ matrix.project }})
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        project:
          - chromium
          - chromium-integration
          - chromium-monthly-replay
          - chromium-production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: node scripts/install-playwright.mjs
      - name: Browser smoke test
        run: npm run test:e2e -- --project=${{ matrix.project }}
