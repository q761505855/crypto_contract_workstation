name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm run check
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build Pages smoke-test artifact
        run: npm run build
        env:
          VITE_BASE_PATH: /crypto_contract_workstation/
          VITE_GITHUB_TOKEN: e2e-mock-storage-token
      - name: Verify Pages artifact
        run: npm run verify:pages
      - name: Install Playwright Chromium
        run: node scripts/install-playwright.mjs
      - name: Pages browser smoke test
        run: npm run test:e2e:pages
      - name: Build Pages artifact with default cloud authorization
        run: npm run build
        env:
          VITE_BASE_PATH: /crypto_contract_workstation/
          VITE_GITHUB_TOKEN: ${{ secrets.CLOUD_STORAGE_TOKEN }}
      - name: Verify final Pages artifact
        run: npm run verify:pages
        env:
          VITE_GITHUB_TOKEN: ${{ secrets.CLOUD_STORAGE_TOKEN }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
