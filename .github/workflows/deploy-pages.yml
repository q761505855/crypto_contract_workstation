name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    outputs:
      artifact-name: ${{ env.PAGES_ARTIFACT }}
      artifact-id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      # Verification is temporarily paused; Vite builds the production bundle directly.
      - name: Build Pages artifact
        run: npx vite build
        env:
          VITE_BASE_PATH: /crypto_contract_workstation/
          CLOUD_STORAGE_TOKEN: ${{ secrets.CLOUD_STORAGE_TOKEN }}
          REQUIRE_CTRADER_CONNECTION: '1'
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install the Actions artifact client
        run: >-
          npm install --prefix "$RUNNER_TEMP/pages-artifact-client"
          --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
          '@actions/artifact@2.1.3'
      - name: Wait for Pages artifact
        uses: actions/github-script@v8
        timeout-minutes: 2
        env:
          PAGES_ARTIFACT_NAME: ${{ needs.build.outputs.artifact-name }}
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        with:
          script: |
            const { join } = require('node:path')
            const { setTimeout: delay } = require('node:timers/promises')
            const { RUNNER_TEMP, PAGES_ARTIFACT_NAME: name, PAGES_ARTIFACT_ID: id } = process.env
            if (!name || !id) throw new Error('Pages artifact name or ID is missing from the build job.')

            // Use the same internal artifact listing as deploy-pages. The REST list can become visible sooner.
            const { DefaultArtifactClient } = require(join(RUNNER_TEMP, 'pages-artifact-client', 'node_modules', '@actions', 'artifact'))
            const client = new DefaultArtifactClient()
            const maxAttempts = 12
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const result = await client.listArtifacts().catch(error => {
                core.warning(`Artifact lookup ${attempt}/${maxAttempts} failed: ${error.message}`)
                return { artifacts: [] }
              })
              const matches = result.artifacts.filter(artifact => artifact.name === name)
              if (matches.length === 1 && String(matches[0].id) === id) {
                core.info(`Pages artifact ${name} (${id}) is visible to the deploy job.`)
                return
              }
              if (attempt < maxAttempts) await delay(5000)
            }
            throw new Error(`Pages artifact ${name} (${id}) is not visible as a unique match after ${maxAttempts} attempts.`)
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact-name }}
