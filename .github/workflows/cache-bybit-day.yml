name: 缓存 Bybit 日成交

on:
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: read

concurrency:
  group: bybit-trade-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: q761505855/personal-cloud-storage
          ref: main
          token: ${{ secrets.CLOUD_STORAGE_TOKEN }}
          path: cloud-storage
          sparse-checkout: projects/crypto-contract-workstation/experiments/ctrader/data/bybit-requests
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: 处理网页提交的日成交缓存请求
        run: |
          git -C cloud-storage config user.name "github-actions[bot]"
          git -C cloud-storage config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/process-bybit-requests.mjs cloud-storage
